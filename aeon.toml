[[site.quickstart.tab]]
label = "Use"
code = "import init, { compute_stats, group_by, rolling_mean } from '@affectively/wasm-data-aggregator';\n\nawait init();\n\nconst stats = compute_stats(values); // { mean, median, stdDev, min, max }\nconst grouped = group_by(data, 'category', 'sum');\nconst smoothed = rolling_mean(timeSeries, 7); // 7-point rolling mean"

[[site.faq]]
q = "What is wasm-data-aggregator?"
a = "A set of high-performance data aggregation utilities written in Rust and compiled to WebAssembly — statistics, grouping, time-series, and histogram operations you call from JavaScript or TypeScript."

[[site.faq]]
q = "What can it compute?"
a = "Statistics (mean, median, standard deviation, percentiles, min, max), group-by aggregations, rolling-window and resampling operations over time series, and histogram binning for distribution analysis."

[[site.faq]]
q = "How do I use it?"
a = "Install the package, call init() to load the WebAssembly module, then call functions like compute_stats, group_by, and rolling_mean directly on your data."

